<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CHSS Data Agreement Drafts</title>
<meta name="description" content="Working drafts of the data partnership language for the Center for High School Success accelerator agreement, with the source of each section.">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root {
    --ink: #111418;
    --ink-2: #3a3f47;
    --ink-3: #6b7280;
    --rule: #e5e7eb;
    --rule-2: #cbd0d8;
    --bg: #ffffff;
    --bg-2: #f7f8fa;
    --accent: #1f4e8c;
    --accent-bg: #eef3fa;
    --draft: #b45309;
    --draft-bg: #fff7ed;
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --measure: 664px;    /* text column, fixed so the header grid and the document grid align */
    --gutter: 36px;      /* breathing room before the source column */
    --srccol: 96px;      /* source column width */
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); background: var(--bg);
    font-family: var(--serif); font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  code { font-family: var(--mono); font-size: 0.9em; background: var(--bg-2); padding: 0 .25em; border-radius: 3px; }

  /* ---------- Pinned header: title row, then selector row ---------- */
  .top {
    position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.97);
    backdrop-filter: saturate(1.2) blur(6px); border-bottom: 1px solid var(--rule);
    font-family: var(--sans);
  }
  .top-inner { max-width: 1120px; margin: 0 auto; padding: 12px 20px 0; }
  /* row1 uses the same column grid as the documents so the draft tag lines up with the Source pills */
  .row1 { display: grid; grid-template-columns: minmax(0, var(--measure)) var(--srccol); column-gap: var(--gutter); align-items: start; }
  .brand { grid-column: 1; font-weight: 650; font-size: 15px; letter-spacing: .005em; color: var(--ink); line-height: 1.25; }
  .brand small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
  .draftwrap { grid-column: 2; justify-self: start; margin-top: 2px; }
  .pillbtn.draftflag {
    font-weight: 600; letter-spacing: .08em; color: var(--draft); background: var(--draft-bg); border-color: #fdba74; border-radius: 4px; padding: 7px 9px;
  }
  .pillbtn.draftflag:hover, .pillbtn.draftflag[aria-expanded="true"] { background: #ffedd5; color: var(--draft); border-color: #fb923c; }
  .draftwrap .pop { width: 240px; }
  .draftwrap .pop ul { list-style: none; margin: 0; padding: 0; }
  .draftwrap .pop li { margin: 0 0 6px; }
  .draftwrap .pop a { text-decoration: none; }
  .row2 { display: flex; align-items: center; padding: 10px 0 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .row2::-webkit-scrollbar { display: none; }
  .tabgroup { display: flex; gap: 8px; }
  .tabgroup.notes { margin-left: 36px; padding-left: 36px; border-left: 1px solid var(--rule); }
  .tabgroup.notes .tab { color: var(--ink-3); }
  .tabgroup.notes .tab[aria-selected="true"] { color: #fff; }
  .tab {
    appearance: none; border: 1px solid var(--rule-2); background: #fff; color: var(--ink-2);
    font: 600 13.5px/1 var(--sans); padding: 10px 16px; border-radius: 6px; cursor: pointer; white-space: nowrap;
    box-shadow: 0 1px 0 rgba(17,20,24,.04);
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: none; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Pill buttons (Source, How to read this) ---------- */
  .pillbtn {
    appearance: none; border: 1px solid var(--rule-2); background: #fff; color: var(--ink-3);
    font: 500 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .pillbtn:hover, .pillbtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .pillbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Document layout: text column + source column ---------- */
  main { max-width: 1120px; margin: 0 auto; padding: 30px 20px 90px; }
  .doc { display: block; }
  .doc[hidden] { display: none; }
  .doc > *:not(.sec), .sec > *:not(.sec-head) { max-width: var(--measure); }
  .doc h1 { font-family: var(--serif); font-weight: 600; font-size: 1.9rem; line-height: 1.2; margin: 0 0 .2em; letter-spacing: -.01em; }
  .doc h2 { font-size: 1.28rem; font-weight: 600; margin: 0; line-height: 1.3; }
  .doc h3 { font-size: 1.06rem; font-weight: 600; margin: 0; line-height: 1.35; }
  .sec { margin: 1.9em 0 0; }
  .sec.lvl3 { margin-top: 1.3em; }
  .sec-head {
    display: grid; grid-template-columns: minmax(0, var(--measure)) var(--srccol);
    column-gap: var(--gutter); align-items: start;
  }
  .sec-head > h2, .sec-head > h3 { grid-column: 1; }
  .sec-head > .srcwrap { grid-column: 2; justify-self: start; margin-top: 3px; }
  .titlewrap, .firstwrap { display: grid; grid-template-columns: minmax(0, var(--measure)) var(--srccol); column-gap: var(--gutter); align-items: start; max-width: none !important; }
  .titlewrap > h1 { grid-column: 1; }
  .titlewrap > .srcwrap { grid-column: 2; justify-self: start; margin-top: 10px; }
  .firstwrap > :first-child { grid-column: 1; }
  .firstwrap > .srcwrap { grid-column: 2; justify-self: start; margin-top: calc(.7em + 4px); }
  .doc p { margin: .7em 0; }
  .doc ul, .doc ol { margin: .5em 0 .9em; padding-left: 1.4em; }
  .doc li { margin: .28em 0; }
  .doc blockquote {
    margin: 1em 0; padding: .6em 1em; border-left: 3px solid var(--rule-2); background: var(--bg-2); border-radius: 0 6px 6px 0;
  }
  .doc blockquote p { margin: .4em 0; }
  .doc table { border-collapse: collapse; width: 100%; margin: .9em 0 1.2em; font-size: 15px; font-family: var(--sans); }
  .doc th, .doc td { border: 1px solid var(--rule); padding: 8px 10px; vertical-align: top; text-align: left; }
  .doc th { background: var(--bg-2); font-weight: 600; }
  .doc hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }
  .doc mark.pending { background: #fff1a8; color: #5c4400; font-family: var(--sans); font-size: .82em; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: normal; }
  .doc details.fold { border: 1px solid var(--rule); border-radius: 8px; margin: 1em 0; background: var(--bg-2); }
  .doc details.fold > summary { cursor: pointer; padding: 10px 14px; font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--ink-2); list-style: none; }
  .doc details.fold > summary::-webkit-details-marker { display: none; }
  .doc details.fold > summary::before { content: "▸ "; color: var(--ink-3); }
  .doc details.fold[open] > summary::before { content: "▾ "; }
  .doc details.fold > .fold-body { padding: 0 14px 10px; background: #fff; border-top: 1px solid var(--rule); border-radius: 0 0 8px 8px; }
  .doc .status { display: inline-block; font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; margin-right: 6px; }
  .doc .status.open { background: #fff7ed; color: #b45309; border: 1px solid #fdba74; }
  .doc .status.made { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  /* inner headings (inside collapsible blocks) */
  .doc .sec-head.inner { margin: 1.1em 0 .2em; }
  .doc .sec-head.inner h4, .doc .sec-head.inner h5 { font-size: 1rem; font-weight: 600; margin: 0; }
  /* download row under a deliverable title */
  .dlrow { display: flex; align-items: center; gap: 6px; margin: 6px 0 4px; font-family: var(--sans); }
  .dl-l { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
  .dl { appearance: none; border: 1px solid var(--rule-2); background: #fff; color: var(--ink-2); text-decoration: none;
        font: 600 12px/1 var(--sans); padding: 7px 11px; border-radius: 6px; box-shadow: 0 1px 0 rgba(17,20,24,.04); }
  .dl:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  /* decisions register: person filter and row details */
  .regfilter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: .6em 0 .8em; font-family: var(--sans); }
  .regfilter-l { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
  .chip { appearance: none; border: 1px solid var(--rule-2); background: #fff; color: var(--ink-2); font: 600 12.5px/1 var(--sans);
          padding: 7px 12px; border-radius: 6px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tablewrap { max-width: none !important; overflow: visible; }   /* no clipping, so row popovers can extend past the table */
  .doc table.register { font-size: 14px; }
  .doc table.register td:nth-child(1) { white-space: nowrap; font-weight: 600; }
  .doc table.register tr[hidden] { display: none; }
  .regwrap { position: relative; display: inline; }
  .regwrap .pillbtn.why { margin-left: 6px; padding: 3px 7px; font-size: 10px; vertical-align: 1px; }
  .regwrap .pop { left: 0; top: calc(100% + 6px); width: min(520px, calc(100vw - 40px)); text-transform: none; letter-spacing: 0; font-weight: 400; }
  .regwrap .pop p { margin: 0 0 8px; }
  .regwrap:hover .pop, .regwrap.open .pop { display: block; }

  /* ---------- Popover ---------- */
  .srcwrap { position: relative; }
  .pop {
    display: none; position: absolute; z-index: 10; top: calc(100% + 8px); left: 0;
    width: min(460px, calc(100vw - 40px)); background: #fff; border: 1px solid var(--rule-2);
    border-radius: 10px; box-shadow: 0 12px 32px rgba(17,20,24,.14); padding: 12px 14px 10px;
    font-family: var(--sans); font-size: 13.5px; line-height: 1.45; color: var(--ink-2); text-transform: none; letter-spacing: 0;
  }
  .srcwrap.open .pop, .srcwrap:hover .pop, .srcwrap:focus-within .pop { display: block; }
  .pop-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .pop ul { list-style: none; margin: 0; padding: 0; }
  .pop li { margin: 0 0 8px; }
  .pop li:last-child { margin-bottom: 0; }
  .pop p { margin: 0 0 8px; }
  .tag {
    display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; white-space: nowrap;
  }
  .src-luke { background: #e8f1ff; color: #1f4e8c; }
  .src-call { background: #ecfdf5; color: #065f46; }
  .src-james { background: #fdf2f8; color: #9d174d; }
  .src-emily { background: #f5f3ff; color: #5b21b6; }
  .src-law { background: #fef3c7; color: #92400e; }
  .src-sdpc { background: #e0f2fe; color: #075985; }
  .src-district { background: #f1f5f9; color: #334155; }
  .src-afdpa { background: #ecfeff; color: #155e75; }
  .src-choice { background: #f3f4f6; color: #374151; }
  .src-other { background: #f3f4f6; color: #374151; }
  .legend .tag { margin: 2px 6px 2px 0; }

  /* Source column popovers: open rightward where there is room, else slide left over the text */
  @media (max-width: 1180px) {
    .sec-head > .srcwrap .pop, .titlewrap > .srcwrap .pop, .firstwrap > .srcwrap .pop, .draftwrap .pop { left: auto; right: 0; }
  }
  @media (max-width: 760px) {
    body { font-size: 16px; }
    .top-inner { padding: 10px 14px 0; }
    .row1, .sec-head, .titlewrap, .firstwrap { grid-template-columns: 1fr; row-gap: 6px; }
    .draftwrap, .sec-head > .srcwrap, .titlewrap > .srcwrap, .firstwrap > .srcwrap { grid-column: 1; margin-top: 0; }
    .sec-head > .srcwrap .pop, .titlewrap > .srcwrap .pop, .firstwrap > .srcwrap .pop, .draftwrap .pop { left: 0; right: auto; }
    .tabgroup.notes { margin-left: 16px; padding-left: 16px; }
    .tablewrap { overflow-x: auto; }
    .regwrap .pop { position: fixed; left: 16px; right: 16px; top: auto; width: auto; max-height: 60vh; overflow: auto; }
  }
  @media print {
    .top, .pillbtn { display: none !important; }
    .pop { display: block !important; position: static; box-shadow: none; border: 1px solid #ccc; margin: 6px 0 10px; width: auto; }
    .doc[hidden] { display: block !important; page-break-before: always; }
    .sec-head, .titlewrap, .firstwrap { grid-template-columns: 1fr; }
    body { font-size: 11pt; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="row1">
      <div class="brand">CHSS data agreement drafts<small>Center for High School Success · National 9th Grade Success Accelerator</small></div>
      <div class="srcwrap draftwrap">
        <button class="pillbtn draftflag" type="button" aria-expanded="false" aria-label="Version history">Draft v{{VERSION}} · {{DATE}}</button>
        <div class="pop" role="dialog"><div class="pop-h">Versions</div><ul><!--VERSIONS--></ul></div>
      </div>
    </div>
    <nav class="row2" role="tablist" aria-label="Pages">
      <div class="tabgroup deliverables"><!--TABS--></div>
      <div class="tabgroup notes"><!--NOTETABS--></div>
    </nav>
  </div>
</header>
<main>
  <!--PANELS-->
</main>
<script>
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var docs = Array.prototype.slice.call(document.querySelectorAll('.doc'));
  function show(key, push) {
    if (key === 'district' || key === 'chss') key = 'mou';   // old links to the two commitment tabs
    var found = docs.some(function (d) { return d.dataset.doc === key; });
    if (!found) key = docs[0].dataset.doc;
    docs.forEach(function (d) { d.hidden = d.dataset.doc !== key; });
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t.dataset.doc === key ? 'true' : 'false'); });
    if (push) { try { history.replaceState(null, '', '#' + key); } catch (e) {} }
    window.scrollTo({ top: 0 });
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.doc, true); }); });
  window.addEventListener('hashchange', function () { show(location.hash.replace('#', ''), false); });
  show(location.hash.replace('#', '') || docs[0].dataset.doc, false);

  // Popovers: hover shows (CSS); click toggles sticky-open; Esc / outside click closes.
  var wraps = Array.prototype.slice.call(document.querySelectorAll('.srcwrap, .regwrap'));
  function closeAll(except) {
    wraps.forEach(function (w) {
      if (w !== except) { w.classList.remove('open'); w.querySelector('.pillbtn').setAttribute('aria-expanded', 'false'); }
    });
  }
  wraps.forEach(function (w) {
    var b = w.querySelector('.pillbtn');
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = !w.classList.contains('open');
      closeAll(w);
      w.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    w.addEventListener('click', function (e) { e.stopPropagation(); });
  });
  document.addEventListener('click', function () { closeAll(null); });
  // Decisions register: person filter
  Array.prototype.slice.call(document.querySelectorAll('.regfilter')).forEach(function (bar) {
    var table = document.getElementById(bar.dataset.register);
    if (!table) return;
    var chips = Array.prototype.slice.call(bar.querySelectorAll('.chip'));
    chips.forEach(function (c) {
      c.addEventListener('click', function () {
        chips.forEach(function (x) { x.setAttribute('aria-pressed', x === c ? 'true' : 'false'); });
        var who = c.dataset.who;
        Array.prototype.slice.call(table.querySelectorAll('tbody tr')).forEach(function (tr) {
          var list = (tr.dataset.who || '').split(' ');
          tr.hidden = !(who === 'all' || list.indexOf(who) !== -1);
        });
      });
    });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(null); });
})();
</script>
</body>
</html>
